name: Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # دریافت سورس پروژه از GitHub
      - name: Checkout
        uses: actions/checkout@v4

      # نصب Java 17 برای Android Build
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # نصب Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ساخت APK نسخه Debug
      - name: Build Debug APK
        run: gradle assembleDebug

      # ذخیره APK ساخته شده به عنوان Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SorenPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
