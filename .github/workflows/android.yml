name: Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # دریافت سورس پروژه
      - name: Checkout
        uses: actions/checkout@v4

      # نصب Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # نصب Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # ساخت APK و ذخیره کامل خروجی Gradle
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --info 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # ذخیره Log حتی در صورت شکست Build
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SorenPlayer-build-log
          path: build.log

      # ذخیره APK در صورت موفقیت Build
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SorenPlayer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
